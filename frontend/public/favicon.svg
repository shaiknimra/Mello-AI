<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="melloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Abstract soft rounded body -->
  <rect x="6" y="8" width="36" height="32" rx="14" fill="url(#melloGrad)" filter="url(#glow)" />
  <!-- Sparkle Antenna -->
  <circle cx="24" cy="5" r="3" fill="#D8B4FE" />
  <line x1="24" y1="5" x2="24" y2="8" stroke="#D8B4FE" stroke-width="2" stroke-linecap="round" />
  <!-- Cute friendly eyes -->
  <circle cx="18" cy="22" r="3" fill="#FFFFFF" />
  <circle cx="30" cy="22" r="3" fill="#FFFFFF" />
  <!-- Catchlight in eyes -->
  <circle cx="19" cy="21" r="1" fill="#121118" />
  <circle cx="31" cy="21" r="1" fill="#121118" />
  <!-- Cute smile -->
  <path d="M20 28 Q24 33 28 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
